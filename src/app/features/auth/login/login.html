<div class="toast-container" *ngIf="showErrorToast">
  <div class="toast error">
    {{ errorMessage }}
  </div>
</div>

<div class="auth-container">
  <div class="auth-brand">
    <div class="auth-logo">
      <img src="/assets/images/cinetrack-logo.png" alt="CineTrack Logo">
      <h1>CineTrack</h1>
    </div>
    <div class="auth-nav">
      <a routerLink="/login" class="active">Login</a>
      <a routerLink="/register">Register</a>
    </div>
  </div>
  
  <div class="auth-card">
    <div class="auth-header">
      <h2>Welcome Back</h2>
      <p class="auth-subtitle">Login to continue tracking your movies</p>
    </div>
    
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
      <!-- Email Field -->
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input
          class="form-input"
          type="email"
          id="email"
          formControlName="email"
          placeholder="Enter your email"
          [class.error]="hasError('email', 'required') || hasError('email', 'email')"
        />
        <span class="form-error" *ngIf="hasError('email', 'required')">
          Email is required
        </span>
        <span class="form-error" *ngIf="hasError('email', 'email')">
          Please enter a valid email
        </span>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input
          class="form-input"
          type="password"
          id="password"
          formControlName="password"
          placeholder="Enter your password"
          [class.error]="hasError('password', 'required')"
        />
        <span class="form-error" *ngIf="hasError('password', 'required')">
          Password is required
        </span>
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        class="btn btn-primary"
        [disabled]="isLoading"
      >
        {{ isLoading ? 'Signing In...' : 'Sign In' }}
      </button>
    </form>
  </div>
</div>
